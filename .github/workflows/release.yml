name: release

# Publishes exactly the artifacts this repository's own candidate gate proved.
# One matrix build job compiles each target on its native runner; the guard
# runs the gate once on ubuntu, proves the tag/version match and the release
# notes, then hands the tag to both the matrix build and the publish job. The
# publish job only assembles uploaded artifacts; it never rebuilds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      expected_tag:
        description: 'Rehearsal tag (must equal the Cargo.toml version); never publishes'
        required: true
        type: string

# Restated explicitly rather than inherited from defaults: the build and guard
# jobs only read the repository; the publishing job declares its own write
# scope below.
permissions:
  contents: read

# A release is a tag moment: never cancel a half-built set of assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    # The guard only reads the repository; it does not need the write scope the
    # publishing job carries.
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0
          components: clippy,rustfmt

      - name: Tag and version guard (fail closed)
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.expected_tag }}
        run: |
          set -euo pipefail
          : "${TAG:?TAG is empty: refused}"
          case "$TAG" in
            v*) ;;
            *) echo "TAG-GUARD-FAIL: tag '$TAG' does not match v*" >&2; exit 1 ;;
          esac
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')"
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "TAG-GUARD-FAIL: version '$VERSION' is not a strict X.Y.Z semver" >&2; exit 1; }
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "TAG-GUARD-FAIL: tag '$TAG' (version '${TAG#v}') != Cargo.toml version '$VERSION'" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Notes guard (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          NOTES=.github/release-notes.md
          [ -f "$NOTES" ] || { echo "NOTES-GUARD-FAIL: $NOTES is missing" >&2; exit 1; }
          if grep -Eq '<tag>|[0-9]+\.[0-9]+\.[0-9]+' "$NOTES"; then
            echo "NOTES-GUARD-FAIL: release notes contain a literal <tag> or a version-shaped token" >&2
            exit 1
          fi

      - name: Candidate gate
        run: sh scripts/verify.sh

  build:
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Install musl linker driver
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prove the artefact (matrix-keyed arch proof)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/comment-free"
          [ -e "$BIN" ] || { echo "PACKAGE-FAIL: missing $BIN" >&2; exit 1; }
          [ -x "$BIN" ] || { echo "PACKAGE-FAIL: $BIN not executable" >&2; exit 1; }
          rustc -vV
          case "$TARGET" in
            *linux-musl)
              case "$BIN" in
                */x86_64-unknown-linux-musl/*) ;;
                *) echo "ARCH-FAIL: unexpected build path $BIN" >&2; exit 1 ;;
              esac
              file "$BIN"
              file "$BIN" | grep -q 'ELF 64-bit' || { echo "ARCH-FAIL: $BIN is not a 64-bit ELF" >&2; exit 1; }
              file "$BIN" | grep -Eq 'statically linked|static-pie linked' || { echo "ARCH-FAIL: $BIN is not statically linked" >&2; exit 1; }
              command -v readelf >/dev/null 2>&1 || { echo "ARCH-FAIL: readelf is unavailable; cannot prove static linkage" >&2; exit 1; }
              readelf -d "$BIN"
              case "$(readelf -d "$BIN" 2>&1)" in
                *NEEDED*) echo "ARCH-FAIL: $BIN has a NEEDED shared-library dependency" >&2; exit 1 ;;
              esac
              case "$(readelf -l "$BIN" 2>&1)" in
                *INTERP*) echo "ARCH-FAIL: $BIN has a program interpreter (PT_INTERP)" >&2; exit 1 ;;
              esac
              ;;
            *apple-darwin)
              case "$BIN" in
                */aarch64-apple-darwin/*) ;;
                *) echo "ARCH-FAIL: unexpected build path $BIN" >&2; exit 1 ;;
              esac
              file "$BIN"
              lipo -info "$BIN"
              file "$BIN" | grep -q 'arm64' || { echo "ARCH-FAIL: $BIN is not arm64" >&2; exit 1; }
              if lipo -info "$BIN" | grep -q 'x86_64'; then
                echo "ARCH-FAIL: $BIN contains x86_64 code" >&2
                exit 1
              fi
              ;;
            *)
              echo "ARCH-FAIL: no arch proof for target '$TARGET'" >&2
              exit 1
              ;;
          esac

      - name: Package dist/
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/comment-free"
          mkdir -p dist
          cp -f "$BIN" "dist/comment-free-${TAG}-${TARGET}"
          chmod 0755 "dist/comment-free-${TAG}-${TARGET}"

      - name: Write and verify per-target SHA256SUMS
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "comment-free-${TAG}-${TARGET}" > "SHA256SUMS-${TARGET}"
            sha256sum -c "SHA256SUMS-${TARGET}"
          else
            shasum -a 256 "comment-free-${TAG}-${TARGET}" > "SHA256SUMS-${TARGET}"
            shasum -a 256 -c "SHA256SUMS-${TARGET}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comment-free-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, build]
    # workflow_dispatch is the rehearsal path: it proves the guard and both
    # build legs, and must never publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Publishing writes the release, the provenance attestation, and the token
    # used to read the attestation; the guard/build jobs only read.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checkout only supplies the release notes file; the artifacts come from
      # the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Binary assets only, deliberately: the per-target SHA256SUMS are
          # derived later and the attestation must bind the shipped executables.
          subject-path: dist/comment-free-*

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          # `gh` is preinstalled on ubuntu-latest. --verify-tag refuses to create
          # a release for a tag that was not pushed.
          gh release create "$TAG" dist/* \
            --verify-tag \
            --notes-file .github/release-notes.md \
            --generate-notes
