[package]
name = "comment-free"
version = "0.2.0"
description = "Rust source comment hygiene tool: strips non-doc comments, normalises rustdoc link idioms, lints doc-comment length"
edition = "2024"
resolver = "3"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/acje/comment-free"
repository = "https://github.com/acje/comment-free"
readme = "README.md"
authors = ["Mattilsynet"]
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
as_pointer_underscore = "warn"
as_underscore = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "warn"
fallible_impl_from = "warn"
fn_to_numeric_cast_any = "warn"
inefficient_to_string = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_include_file = "warn"
literal_string_with_formatting_args = "warn"
manual_clamp = "warn"
manual_instant_elapsed = "warn"
manual_is_ascii_check = "warn"
manual_let_else = "warn"
manual_pattern_char_comparison = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_wild_err_arm = "warn"
mixed_read_write_in_expression = "warn"
mut_mut = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_else = "warn"
rest_pat_in_fully_bound_structs = "warn"
search_is_some = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
todo = "warn"
trailing_empty_array = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unneeded_field_pattern = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
unnecessary_wraps = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
wildcard_enum_match_arm = "warn"
zero_sized_map_values = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
syn = { version = "2", features = [
    "full",
    "extra-traits",
    "parsing",
    "visit",
    "visit-mut",
] }
proc-macro2 = { version = "1", features = ["span-locations"] }
ra-ap-rustc_lexer = "=0.174.0"
walkdir = "2"
similar = "3"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
overflow-checks = true
